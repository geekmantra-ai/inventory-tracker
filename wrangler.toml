name = "inventory-management-platform"
main = "src/worker.js"
compatibility_date = "2025-03-20"
compatibility_flags = ["nodejs_compat", "no_handle_cross_request_promise_resolution"]
preview_urls = false

routes = [
  { pattern = "stockpulse.geekmantra.com", custom_domain = true }
]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Cloudflare D1 Native Database Binding
[[d1_databases]]
binding = "DB"
database_name = "stockpulse-db"
database_id = "16aebdb0-d89b-4de2-98b5-10823ae67de4"

# Upload all secrets from .dev.vars in one command after deploying:
#   npx wrangler secret bulk .dev.vars

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[observability.issue_detection]
enabled = true

